<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CUTIL - Diagrama de Topologia</title>
    <script type="text/javascript" src="https://unpkg.com/vis-network/standalone/umd/vis-network.min.js"></script>
    <style>
        body, html { margin: 0; padding: 0; height: 100%; font-family: Arial, sans-serif; }
        #topologia { width: 100%; height: 100vh; background-color: #1e1e1e; }
        #painel-controle {
            position: absolute;
            top: 20px;
            left: 20px;
            background: rgba(0,0,0,0.8);
            padding: 15px;
            border-radius: 8px;
            color: white;
            font-size: 14px;
            z-index: 100;
            border: 1px solid #444;
        }
    </style>
</head>
<body>
    
    <!-- Painel flutuante de legenda -->
    <div id="painel-controle">
        <h3 style="margin: 0 0 10px 0; font-size: 16px;">Legenda CUTIL</h3>
        <div style="color: #e74c3c;">◼ Origem (Vem de)</div>
        <div style="color: #3498db;">◼ Disjuntor / Painel</div>
        <div style="color: #2ecc71;">◼ Carga (Alimenta)</div>
        <div style="margin-top: 10px; font-size: 12px; color: #aaa;">Arraste para mover. Use o scroll para zoom.</div>
    </div>

    <div id="topologia"></div>

    <script>
        async function carregarDiagrama() {
            try {
                // Busca o arquivo JSON no mesmo diretório
                const response = await fetch('data.json');
                const rawData = await response.json();

                const nodesSet = new Map();
                const edges = [];

                function addNode(id, label, grupo, cor) {
                    // Evita criar nós vazios caso alguma célula da planilha esteja em branco
                    if (id && String(id).trim() !== "" && !nodesSet.has(id)) {
                        nodesSet.set(id, { 
                            id: id, 
                            label: label, 
                            group: grupo,
                            color: { background: cor, border: '#ffffff' },
                            font: { color: '#ffffff' },
                            shape: 'box'
                        });
                    }
                }

                rawData.forEach(raw => {
                    // SUA LÓGICA DE NORMALIZAÇÃO
                    const painel = raw["Painel"] ? String(raw["Painel"]).trim() : "";
                    const disjuntor = raw["Disjuntor"] ? String(raw["Disjuntor"]).trim() : "";
                    const vem_de = (raw["Vem de "] || raw["Vem de"] || "").trim();
                    const vai_para = (raw["Alimenta"] || raw["Vai para"] || "").trim();
                    
                    // Só processa se tiver um painel e disjuntor válidos
                    if(painel) {
                        const idAtual = disjuntor ? `${painel} | ${disjuntor}` : painel;
                        const labelAtual = disjuntor ? `${disjuntor}\n(${painel})` : painel;
                        
                        // 1. Cria os Nós
                        addNode(vem_de, vem_de, 'origem', '#e74c3c');
                        addNode(idAtual, labelAtual, 'disjuntor', '#3498db');
                        addNode(vai_para, vai_para, 'carga', '#2ecc71');

                        // 2. Cria as Conexões
                        if (vem_de) {
                            edges.push({ from: vem_de, to: idAtual, arrows: 'to', color: '#7f8c8d' });
                        }
                        if (vai_para) {
                            edges.push({ from: idAtual, to: vai_para, arrows: 'to', color: '#7f8c8d' });
                        }
                    }
                });

                const container = document.getElementById('topologia');
                const data = { nodes: Array.from(nodesSet.values()), edges: edges };
                const options = {
                    layout: {
                        hierarchical: {
                            direction: 'UD',
                            sortMethod: 'directed',
                            nodeSpacing: 120,
                            levelSeparation: 150,
                            treeSpacing: 200
                        }
                    },
                    physics: false,
                    interaction: {
                        dragNodes: true,
                        zoomView: true,
                        dragView: true,
                        hover: true // Acende o nó quando passa o mouse
                    }
                };

                new vis.Network(container, data, options);

            } catch (error) {
                console.error("Erro ao carregar data.json:", error);
                document.getElementById('topologia').innerHTML = `<h2 style="color:white; padding: 20px;">Erro ao carregar os dados. Verifique se o data.json está na mesma pasta e se você está acessando via GitHub Pages (https://).</h2>`;
            }
        }

        carregarDiagrama();
    </script>
</body>
</html>
