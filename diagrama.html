<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CUTIL - Topologia Híbrida</title>
    <!-- Servidor mais seguro e rápido para a biblioteca visual -->
    <script type="text/javascript" src="https://cdnjs.cloudflare.com/ajax/libs/vis-network/9.1.9/standalone/umd/vis-network.min.js"></script>
    <style>
        body, html { margin: 0; padding: 0; height: 100%; font-family: Arial, sans-serif; overflow: hidden; background-color: #1e1e1e; }
        #topologia { width: 100%; height: 100vh; }
        
        #painel-controle {
            position: absolute; top: 20px; left: 20px;
            background: rgba(0,0,0,0.85); padding: 15px; border-radius: 8px;
            color: white; font-size: 14px; z-index: 100; border: 1px solid #444;
        }
        .busca-container { margin-top: 15px; border-top: 1px solid #555; padding-top: 15px; }
        input[type="text"] { padding: 8px; width: 200px; border-radius: 4px; border: 1px solid #555; background: #333; color: white; }
        button { padding: 8px 12px; cursor: pointer; border-radius: 4px; border: none; background: #3498db; color: white; font-weight: bold; margin-left: 5px;}
        button:hover { background: #2980b9; }
        #msg-erro { display: none; color: #e74c3c; margin-top: 8px; font-weight: bold; }
    </style>
</head>
<body>
    
    <div id="painel-controle">
        <h3 style="margin: 0 0 10px 0;">Legenda CUTIL</h3>
        <div style="color: #e74c3c;">◼ Origem</div>
        <div style="color: #3498db;">◼ Disjuntor / Painel</div>
        <div style="color: #2ecc71;">◼ Carga / Destino</div>
        
        <div class="busca-container">
            <input type="text" id="inputBusca" placeholder="Ex: Chiller, 52.SC1..." />
            <button onclick="buscarNo()">Buscar</button>
            <div id="msg-erro"></div>
        </div>
    </div>

    <div id="topologia"></div>

    <script>
        let rede = null;
        let todosNos = [];

        // 1. COLAMOS OS SEUS DADOS AQUI DIRETAMENTE! 
        // Eu coloquei apenas os primeiros para você testar agora. 
        // Se funcionar, você substitui esse bloco pelo seu JSON completo de 400 linhas.
        const rawData = [
            { "Painel": "PN-5142002", "Disjuntor": "52.SC1", "Vem de": "PN-5142001", "Alimenta": "Barra B" },
            { "Painel": "PN-5142002", "Disjuntor": "52.S01", "Vem de": "PN-5142001", "Alimenta": "BCP-5142001A" },
            { "Painel": "PN-5142002", "Disjuntor": "52.S03", "Vem de": "PN-5142001", "Alimenta": "PN-025101-02" },
            { "Painel": "PN-025101-02", "Disjuntor": "52.EC3", "Vem de": "Barra A", "Alimenta": "Barra B" },
            { "Painel": "PN-025101-02", "Disjuntor": "52.EA6", "Vem de": "PN-5142002", "Alimenta": "PN-025101-02" }
        ];

        function iniciarDiagrama() {
            const nodesSet = new Map();
            const edges = [];

            function addNode(id, label, grupo, cor) {
                if (id && String(id).trim() !== "" && !nodesSet.has(id)) {
                    nodesSet.set(id, { 
                        id: id, label: label, group: grupo,
                        color: { background: cor, border: '#ffffff' },
                        font: { color: '#ffffff' }, shape: 'box'
                    });
                }
            }

            rawData.forEach(raw => {
                const painel = raw["Painel"] ? String(raw["Painel"]).trim() : "";
                const disjuntor = raw["Disjuntor"] ? String(raw["Disjuntor"]).trim() : "";
                const vem_de = raw["Vem de"] ? String(raw["Vem de"]).trim() : "";
                const vai_para = raw["Alimenta"] ? String(raw["Alimenta"]).trim() : "";
                
                if(painel) {
                    const idAtual = disjuntor ? `${painel} | ${disjuntor}` : painel;
                    const labelAtual = disjuntor ? `${disjuntor}\n(${painel})` : painel;
                    
                    if (vem_de) addNode(vem_de, vem_de, 'origem', '#e74c3c');
                    addNode(idAtual, labelAtual, 'disjuntor', '#3498db');
                    if (vai_para) addNode(vai_para, vai_para, 'carga', '#2ecc71');

                    if (vem_de) edges.push({ from: vem_de, to: idAtual, arrows: 'to', color: '#7f8c8d' });
                    if (vai_para) edges.push({ from: idAtual, to: vai_para, arrows: 'to', color: '#7f8c8d' });
                }
            });

            todosNos = Array.from(nodesSet.values());
            const container = document.getElementById('topologia');
            const data = { nodes: todosNos, edges: edges };
            
            const options = {
                physics: {
                    enabled: true,
                    barnesHut: { gravitationalConstant: -2500, springLength: 150 },
                    stabilization: { iterations: 150 }
                },
                interaction: { dragNodes: true, zoomView: true, hover: true }
            };

            rede = new vis.Network(container, data, options);
        }

        function buscarNo() {
            const termo = document.getElementById('inputBusca').value.toLowerCase().trim();
            const msgErro = document.getElementById('msg-erro');
            msgErro.style.display = 'none';
            if (!termo) return;

            const noEncontrado = todosNos.find(n => 
                String(n.label).toLowerCase().includes(termo) || String(n.id).toLowerCase().includes(termo)
            );

            if (noEncontrado) {
                rede.focus(noEncontrado.id, { scale: 1.5, animation: { duration: 1000 } });
                rede.selectNodes([noEncontrado.id]);
            } else {
                msgErro.innerText = 'Não encontrado!';
                msgErro.style.display = 'block';
            }
        }

        // Inicia o sistema imediatamente (sem fetch)
        iniciarDiagrama();
    </script>
</body>
</html>
